# Test-only overrides (config/ takes precedence over the main application.properties).
# Every test, including @DataJpaTest slices, uses an in-memory H2 in PostgreSQL mode,
# migrated by Flyway exactly like the real database, and never touches ./data.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.test.database.replace=none

# Tests never call the real Claude API: FakeLlmClient (src/test) is the LlmClient bean.
llm.provider=fake
llm.api-key=
