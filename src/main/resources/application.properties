spring.application.name=interview-trainer

# H2 in PostgreSQL mode, so SQL that would not run on Postgres fails early.
spring.datasource.url=jdbc:h2:file:./data/interview-trainer;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info

# --- LLM (Claude API). The key comes only from the ANTHROPIC_API_KEY environment variable. ---
llm.provider=anthropic
llm.model=claude-opus-5-5
llm.api-key=${ANTHROPIC_API_KEY:}
llm.max-tokens=16000
llm.default-effort=MEDIUM
llm.timeout=120s
llm.max-retries=2
